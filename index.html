<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#4b5cf0">
<title>成长计划</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f7fb;--ink:#141a24;--sub:#5d6878;--line:rgba(228,232,240,0.6);
  --card:rgba(255,255,255,0.65); /* 卡片半透明 */
  --brand:#4b5cf0;--brand2:#8b5cf6;--ok:#0f9d76;--warn:#c2410c;
  --radius:14px;--shadow:0 4px 16px -4px rgba(20,26,36,.1);
  --sb: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);
  background-color:var(--bg);
  background-size:cover;background-position:center;background-attachment:fixed;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;transition:background 0.3s;
}
/* 背景遮罩变薄，背景图更清晰 */
body.has-bg::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,0.35);z-index:-1;backdrop-filter:blur(3px);}
#app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:60px}
.view{padding:16px 14px calc(16px + var(--sb));display:none}
.view.active{display:block}

/* Tab */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,255,255,.85);border-top:1px solid var(--line);padding:6px 0 calc(6px + var(--sb));backdrop-filter:blur(12px);}
#tabbar button{flex:1;border:0;background:none;padding:6px 0 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:11px;font-family:inherit;}
#tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabbar button.active{color:var(--brand)}

/* 通用 */
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:14.5px;margin:0 0 8px}
.muted{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.pad{padding:14px}
.bar{height:8px;border-radius:999px;background:rgba(233,237,246,0.8);overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:999px;transition:width .35s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,0.8);color:var(--ink);font-size:13.5px;font-family:inherit;cursor:pointer;backdrop-filter:blur(5px);}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.danger{background:rgba(255,255,255,0.8);color:var(--warn);border-color:rgba(194,65,12,.35)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* 今日 */
.cycle-progress{margin-bottom:12px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;}
.cycle-progress-bar{height:4px;background:rgba(0,0,0,0.05);border-radius:999px;margin-top:4px;overflow:hidden;}
.cycle-progress-bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s;}
.today-head{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.today-date{font-size:26px;font-weight:700;letter-spacing:-.02em}
.today-week{color:var(--sub);font-size:13px}
.today-stat{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,0.75);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--sub);backdrop-filter:blur(5px);}
.pill b{color:var(--ink)}

/* 任务卡 */
.task{display:flex;gap:10px;align-items:flex-start;padding:12px 12px;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all 0.2s;user-select:none;}
.task.done{opacity:.6;background:rgba(255,255,255,0.4);}
.task.pinned{border-color:rgba(75,92,240,0.4);box-shadow:0 0 0 1px rgba(75,92,240,0.2),var(--shadow);}
.task .cb{flex:none;width:22px;height:22px;border:1.6px solid #c3cddd;border-radius:7px;background:rgba(255,255,255,0.8);margin-top:1px;position:relative;cursor:pointer;}
.task.done .cb{background:var(--ok);border-color:var(--ok)}
.task.done .cb::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:12px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.task .body{min-width:0;flex:1;}
.task .t1{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.task .title{font-weight:600;font-size:14.5px}
.task.done .title{text-decoration:line-through;color:#9aa5b5}
.task .min{font-size:11.5px;color:#7c8797;background:rgba(242,245,250,0.8);border-radius:6px;padding:1px 6px}
.task .tag-box{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:6px;color:#fff;margin-right:4px;}
.task .how{font-size:12.8px;color:var(--sub);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.task .more{border:0;background:none;color:#93a0b4;font-size:20px;padding:0 4px;cursor:pointer;line-height:1;}
.empty{padding:24px;text-align:center;color:var(--sub);font-size:13px;}

/* 热力图 —— 终极暴力修复版 */
.heatmap-wrap { width: 100%; overflow: hidden; margin-top: 10px; }
.hm-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--sub); margin-bottom: 6px; }
.heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; }
.hm-cell-wrap { position: relative; width: 100%; padding-top: 100%; border-radius: 4px; overflow: hidden; }
.hm-cell { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.05); }
.hm-cell.lv1{background:rgba(75,92,240,0.2)}
.hm-cell.lv2{background:rgba(75,92,240,0.4)}
.hm-cell.lv3{background:rgba(75,92,240,0.6)}
.hm-cell.lv4{background:rgba(75,92,240,0.85)}
.hm-cell.lv5{background:rgba(75,92,240,1)}
.hm-cell.empty{background:transparent !important;}
.hm-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--sub);margin-top:10px;}
.hm-legend span{width:12px;height:12px;border-radius:3px;}

/* 周期 */
.daygrp{margin-top:14px}
.dayhead{position:sticky;top:0;z-index:5;background:rgba(245,247,251,0.85);backdrop-filter:blur(4px);display:flex;align-items:baseline;gap:8px;padding:8px 2px 6px;font-weight:650;}
.dayhead .dt{font-size:14.5px}.dayhead .wd{font-size:12px;color:var(--sub);font-weight:400}
.dayhead .cnt{margin-left:auto;font-size:12px;color:var(--sub);font-weight:400}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:2px -2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,0.8);color:var(--sub);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;backdrop-filter:blur(5px);}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seqbox{margin-top:16px}
.seqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:8px}
.sq{padding:6px 4px;text-align:center;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,0.7);font-size:11px;line-height:1.3;backdrop-filter:blur(5px);}
.sq b{display:block;font-size:11.5px}.sq i{font-style:normal;color:#a5b0c0;font-size:10px;letter-spacing:.06em}
.sq.on{background:rgba(15,157,118,.1);border-color:rgba(15,157,118,.4);color:#0b6b51}.sq.on i{color:#0b6b51}

/* 我的 */
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;backdrop-filter:blur(10px);}
.stat .k{font-size:12px;color:var(--sub)}.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.list{list-style:none;padding:0;margin:8px 0 0}
.list li{padding:10px 0;border-bottom:1px solid rgba(241,244,249,0.6);display:flex;align-items:center;gap:8px;font-size:13.5px}
.list li:last-child{border-bottom:0}
.ph{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(241,244,249,0.6);font-size:13.5px}
.ph:last-child{border-bottom:0}
.ph .nm{flex:1}.ph .pg{width:100px;height:6px;border-radius:999px;background:rgba(233,237,246,0.8);overflow:hidden}.ph .pg i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.ph .v{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.searchbox{display:flex;gap:8px;margin-top:8px}
.searchbox input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-family:inherit;background:rgba(255,255,255,0.7);color:var(--ink);backdrop-filter:blur(5px);}
.results li{cursor:pointer}.results li:hover{background:rgba(250,251,254,0.8)}

/* Modal & Form */
#modal-root{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center}
#modal-root.on{display:flex}
.mask{position:absolute;inset:0;background:rgba(15,20,30,.45);backdrop-filter:blur(2px);}
.modal{position:relative;width:100%;max-width:520px;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--sb));max-height:88dvh;overflow-y:auto;box-shadow:0 -10px 30px -8px rgba(0,0,0,.2);animation:up .2s ease-out;}
@keyframes up{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.modal h3{margin:0 0 10px;font-size:16px}
.field{margin:10px 0}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-family:inherit;color:var(--ink);background:#fff;}
.field textarea{min-height:64px;resize:vertical}
.field .row{gap:8px}.field .row>*{flex:1}
.weekd{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.weekd button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--sub);font-family:inherit;font-size:12.5px;cursor:pointer;}
.weekd button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* 详情页及子任务 */
.detail-row{margin-bottom:12px;font-size:14px;line-height:1.6;}
.detail-label{font-size:12px;color:var(--sub);margin-bottom:2px;}
.detail-val{font-weight:500;}
.detail-box{background:#f8fafc;padding:10px;border-radius:8px;font-size:13.5px;color:#334155;margin-top:2px;white-space:pre-wrap;}
.subtask-list{list-style:none;padding:0;margin:8px 0;}
.subtask-list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f1f4f9;font-size:13.5px;}
.subtask-list li:last-child{border-bottom:0;}
.subtask-list input[type="checkbox"]{width:18px;height:18px;accent-color:var(--brand);cursor:pointer;}
.btn-timer{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;border:none;padding:10px;border-radius:10px;width:100%;font-size:15px;font-weight:bold;margin-top:10px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px;}

/* 工具 */
#back-to-top{position:fixed;right:16px;bottom:80px;width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;font-size:20px;border:none;box-shadow:0 4px 12px rgba(75,92,240,.3);display:none;align-items:center;justify-content:center;z-index:90;}
#back-to-top.show{display:flex;}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(20,26,36,.92);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

    if (a.pinned && !b.pinned) return -1; if (!a.pinned && b.pinned) return 1;

  let cur = todayStr(); const todayP = progressOn(cur);
  if (todayP.total > 0 && todayP.done < todayP.total) cur = addDays(cur, -1);
  let n = 0;

              <div class="bar"><i style="width:${p.pct}%"></i></div>`;

  if (!ts.length) {
    html += '<div class="empty card" style="margin-top:14px">今天还没有任务。<br><br><button class="btn primary" id="btn-add-today">+ 添加今日任务</button></div>';
  } else {
    const undone = ts.filter(t => !isChecked(t));
    const done = ts.filter(t => isChecked(t));
    
    html += '<div id="today-tasks">';
    undone.forEach(t => html += renderTaskHTML(t));
    html += '</div>';
    
    if (done.length > 0) {
      html += `<div style="margin-top:16px;display:flex;align-items:center;gap:10px;">
                <div style="flex:1;height:1px;background:rgba(200,200,200,0.5)"></div>
                <div class="muted" style="font-size:12px;cursor:pointer;" id="toggle-done">已折叠 ${done.length} 项已完成任务 ▾</div>
                <div style="flex:1;height:1px;background:rgba(200,200,200,0.5)"></div>
               </div>`;
      html += `<div id="done-tasks" style="display:none;margin-top:8px;">`;
      done.forEach(t => html += renderTaskHTML(t));
      html += `</div>`;
    }
    html += '<div style="margin-top:20px;text-align:center"><button class="btn" id="btn-add-today">+ 添加今日任务</button></div>';
  }
  el.innerHTML = html;
  
  el.querySelector('#btn-add-today').onclick = () => openTaskEditor(null, { date: today });
  const toggleBtn = el.querySelector('#toggle-done');
  if (toggleBtn) {
    toggleBtn.onclick = () => {
      const container = el.querySelector('#done-tasks');
      const isHidden = container.style.display === 'none';
      container.style.display = isHidden ? 'block' : 'none';
      toggleBtn.innerHTML = isHidden ? '收起已完成任务 ▴' : `已折叠 ${done.length} 项已完成任务 ▾`;
    };
  }
  bindTaskEvents(el);
}

/* ========== 视图：周期 ========== */
let cycleFilterPhase = 'all', cycleFilterTag = 'all', cycleSearch = '';
function renderCycle() {
  const el = document.getElementById('view-cycle'); const m = state.meta;
  let html = '<h1>周期</h1><p class="muted">' + m.startDate + ' – ' + m.endDate + ' · 共 ' + state.tasks.length + ' 项</p><div class="row" style="margin-top:8px"><button class="btn sm" id="btn-edit-cycle">修改周期起止</button><button class="btn sm primary" id="btn-add-range">+ 添加任务</button></div><div class="searchbox"><input id="cycle-search" type="search" placeholder="搜索标题…" value="' + escapeAttr(cycleSearch) + '"></div>';
  
  // 阶段筛选
  html += '<div class="chips" style="margin-top:10px"><button class="chip' + (cycleFilterPhase==='all'?' on':'') + '" data-f="all">全部阶段</button>';
  PHASES.forEach((p, i) => html += '<button class="chip' + (cycleFilterPhase===String(i)?' on':'') + '" data-f="' + i + '">' + p.name + '</button>');
  html += '</div>';

  // 标签筛选
  const tags = getTags();
  if(tags.length > 0) {
    html += '<div class="chips" style="margin-top:6px"><button class="chip' + (cycleFilterTag==='all'?' on':'') + '" data-t="all">全部标签</button>';
    tags.forEach(tag => {
      html += '<button class="chip' + (cycleFilterTag===tag?' on':'') + '" data-t="' + tag + '">' + tag + '</button>';
    });
    html += '</div>';
  }

  html += '<div class="seqbox card pad"><h3>阿达帕林核对（只读）</h3><div class="seqgrid">' + renderSeqGrid() + '</div></div>';
  const dates = filteredDates();
  if (!dates.length) html += '<div class="empty">没有匹配的任务</div>';
  else dates.forEach(d => {
    const ts = tasksOn(d).filter(taskMatchesFilter); if (!ts.length) return;
    const p = progressOn(d);
    html += '<div class="daygrp"><div class="dayhead"><span class="dt">' + fmtCN(d) + '</span><span class="wd">' + wdCN(d) + '</span><span class="cnt">' + p.done + '/' + p.total + '</span></div>';
    ts.forEach(t => html += renderTaskHTML(t)); html += '</div>';
  });
  el.innerHTML = html;
  el.querySelector('#btn-edit-cycle').onclick = openEditCycleDialog;
  el.querySelector('#btn-add-range').onclick = openAddRangeDialog;
  el.querySelector('#cycle-search').addEventListener('input', e => { cycleSearch = e.target.value.trim(); renderCycle(); });
  
  el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { cycleFilterPhase = b.getAttribute('data-f'); renderCycle(); });
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { cycleFilterTag = b.getAttribute('data-t'); renderCycle(); });
  bindTaskEvents(el);
}
function taskMatchesFilter(t) {
  if (cycleFilterPhase !== 'all') { const p = PHASES[Number(cycleFilterPhase)]; if (p && (t.date < p.start || t.date > p.end)) return false; }
  if (cycleFilterTag !== 'all' && t.tag !== cycleFilterTag) return false;
  if (cycleSearch) { const q = cycleSearch.toLowerCase(); if (t.title.toLowerCase().indexOf(q) < 0 && (t.how||'').toLowerCase().indexOf(q) < 0) return false; }
  return true;
}
function filteredDates() {
  let ds = allDates();
  if (cycleFilterPhase !== 'all') { const p = PHASES[Number(cycleFilterPhase)]; if (p) ds = ds.filter(d => d >= p.start && d <= p.end); }
  if (cycleSearch) ds = ds.filter(d => tasksOn(d).some(taskMatchesFilter));
  return ds;
}
function renderSeqGrid() {
  const adap = state.tasks.filter(t => t.category === 'sk' && /阿达帕林/.test(t.title)).sort((a,b) => cmpDate(a.date, b.date));
  if (!adap.length) return '<div class="muted" style="grid-column:1/-1;font-size:12.5px">无</div>';
  return adap.map(t => '<div class="sq' + (isChecked(t)?' on':'') + '"><b>' + fmtCN(t.date) + '</b><i>第' + (adap.indexOf(t)+1) + '次</i></div>').join('');
}

/* ========== 视图：我的 ========== */
function renderMe() {
  const el = document.getElementById('view-me'); const o = overallProgress(), streak = streakDays(), wk = weekProgress(todayStr()), today = todayStr();
  let html = '<h1>我的</h1><div class="statgrid"><div class="stat"><div class="k">总进度</div><div class="v">' + o.pct + '%</div><div class="muted" style="font-size:12px">' + o.done + ' / ' + o.total + '</div></div><div class="stat"><div class="k">连续打卡</div><div class="v">' + streak + '<span style="font-size:13px;font-weight:400;color:var(--sub)"> 天</span></div></div><div class="stat"><div class="k">今日完成</div><div class="v">' + progressOn(today).done + '<span style="font-size:13px;font-weight:400;color:var(--sub)">/' + progressOn(today).total + '</span></div></div><div class="stat"><div class="k">本周完成率</div><div class="v">' + wk.pct + '%</div></div></div>';
  
  // 热力图
  html += '<div class="card pad" style="margin-top:12px"><h3>周期打卡热力图</h3>' + renderHeatmap() + '</div>';

  html += '<div class="card pad" style="margin-top:12px"><h3>五个阶段</h3>' + renderPhaseListHTML() + '</div><div class="card pad" style="margin-top:12px"><h3>快捷操作</h3><div class="row"><button class="btn" id="btn-check-today">勾选今日全部</button><button class="btn" id="btn-uncheck-today">取消今日全部</button></div></div>';
  html += '<div class="card pad" style="margin-top:12px"><h3>搜索</h3><div class="searchbox"><input id="me-search" type="search" placeholder="输入关键词搜索"></div><ul class="list results" id="me-results"></ul></div>';
  
  // 背景图
  html += `<div class="card pad" style="margin-top:12px"><h3>自定义背景</h3><p class="muted" style="font-size:12px;margin-bottom:8px;">上传一张图片作为整个 App 的背景（自动加半透明遮罩保证清晰度）。</p><div class="row"><input type="file" id="bg-file" accept="image/*" style="display:none;"><button class="btn sm" id="btn-upload-bg">上传图片</button><button class="btn sm danger" id="btn-clear-bg">清除背景</button></div></div>`;

  html += '<div class="card pad" style="margin-top:12px"><h3>批量导入计划</h3><p class="muted" style="font-size:12.5px;margin:0 0 10px">格式：日期 | 标签 | 标题 | 时长 | 怎么做 | 完成标准</p><button class="btn primary" id="btn-bulk-import">粘贴文本生成任务</button></div>';
  html += '<div class="card pad" style="margin-top:12px"><h3>数据管理</h3><div class="row"><button class="btn primary" id="btn-export">导出 JSON</button><button class="btn" id="btn-import">导入 JSON</button><button class="btn danger" id="btn-reset">重置为初始计划</button></div></div>';
  el.innerHTML = html;

  el.querySelector('#btn-check-today').onclick = () => { tasksOn(today).forEach(t => { if (!isChecked(t)) toggleCheck(t); }); renderAll(); toast('已勾选今日全部'); };
  el.querySelector('#btn-uncheck-today').onclick = () => { tasksOn(today).forEach(t => { if (isChecked(t)) toggleCheck(t); }); renderAll(); toast('已取消今日全部'); };
  el.querySelector('#btn-export').onclick = exportJSON; el.querySelector('#btn-import').onclick = openImportDialog; el.querySelector('#btn-reset').onclick = openResetDialog; el.querySelector('#btn-bulk-import').onclick = openBulkImportDialog;
  
  const bgFile = el.querySelector('#bg-file');
  el.querySelector('#btn-upload-bg').onclick = () => bgFile.click();
  el.querySelector('#btn-clear-bg').onclick = () => { localStorage.removeItem('custom-bg-img'); applyBackground(); toast('已清除背景'); };
  bgFile.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const MAX = 1080;
        let w = img.width, h = img.height;
        if (w > MAX) { h = h * MAX / w; w = MAX; }
        canvas.width = w; canvas.height = h;
        ctx.drawImage(img, 0, 0, w, h);
        const b64 = canvas.toDataURL('image/jpeg', 0.75);
        localStorage.setItem('custom-bg-img', b64);
        applyBackground(); toast('背景已更新');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  };

  el.querySelector('#me-search').addEventListener('input', e => {
    const q = e.target.value.trim(); const list = document.getElementById('me-results');
    if (!q) { list.innerHTML = ''; return; }
    const hits = state.tasks.filter(t => t.title.toLowerCase().indexOf(q.toLowerCase()) >= 0).slice(0, 30);
    list.innerHTML = hits.map(t => '<li data-id="' + t.id + '"><span class="cat" style="background:' + (t.tagColor||'#6b7280') + '"></span>' + escapeHTML(t.title) + '<span class="spacer"></span><span class="muted" style="font-size:12px">' + fmtCN(t.date) + '</span></li>').join('') || '<li class="muted" style="border:0">没有匹配</li>';
    list.querySelectorAll('li[data-id]').forEach(li => { li.onclick = () => { const t = state.tasks.find(x => x.id === li.getAttribute('data-id')); if(t){ switchView('cycle'); cycleFilterPhase = 'all'; cycleFilterTag = 'all'; cycleSearch = t.title; renderCycle(); } }; });
  });
}
function renderPhaseListHTML() { return PHASES.map(p => { const pr = phaseProgress(p); return '<div class="ph"><span class="nm">' + p.name + '</span><span class="pg"><i style="width:' + pr.pct + '%"></i></span><span class="v">' + pr.done + '/' + pr.total + '</span></div>'; }).join(''); }

function renderHeatmap() {
  const m = state.meta;
  let start = m.startDate;
  let end = m.endDate;
  start = addDays(start, -(wdOf(start)===0 ? 6 : wdOf(start)-1));
  end = addDays(end, 7-wdOf(end));
  
  let cellsHtml = '';
  let cur = start;
  let hasData = false;
  
  while (cur <= end) {
    if (cur >= m.startDate && cur <= m.endDate) {
      hasData = true;
      const p = progressOn(cur);
      let lv = '';
      if (p.total > 0) {
        if (p.pct === 0) lv = '';
        else if (p.pct < 30) lv = 'lv1';
        else if (p.pct < 60) lv = 'lv2';
        else if (p.pct < 90) lv = 'lv3';
        else if (p.pct < 100) lv = 'lv4';
        else lv = 'lv5';
      }
      cellsHtml += `<div class="hm-cell-wrap"><div class="hm-cell ${lv}" title="${cur} (${p.done}/${p.total})"></div></div>`;
    } else {
      cellsHtml += `<div class="hm-cell-wrap"><div class="hm-cell empty"></div></div>`;
    }
    cur = addDays(cur, 1);
  }
  if(!hasData) return '';
  
  return `<div class="heatmap-wrap">
            <div class="hm-header"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
            <div class="heatmap">${cellsHtml}</div>
            <div class="hm-legend">少 <span style="background:rgba(0,0,0,0.05)"></span><span style="background:rgba(75,92,240,0.2)"></span><span style="background:rgba(75,92,240,0.4)"></span><span style="background:rgba(75,92,240,0.85)"></span> 多</div>
          </div>`;
}

/* ========== 任务渲染 ========== */
function renderTaskHTML(t) {
  const done = isChecked(t);
  const cat = t.tagColor || '#6b7280';
  const tagName = t.tag || '自定义';
  let timeStr = t.startTime && t.endTime ? `<span class="min" style="background:rgba(75,92,240,.1);color:var(--brand);">${t.startTime}-${t.endTime}</span>` : `<span class="min">${t.minutes}min</span>`;
  
  let subInfo = '';
  if (t.subtasks && t.subtasks.length > 0) {
    const subDone = t.subtasks.filter(st => st.done).length;
    subInfo = `<span style="font-size:11.5px;color:var(--brand);background:rgba(75,92,240,0.1);padding:1px 6px;border-radius:6px;margin-left:6px;">子任务 ${subDone}/${t.subtasks.length}</span>`;
  }

  return `<div class="task${done?' done':''}${t.pinned?' pinned':''}" data-id="${t.id}">
    <span class="cb" data-act="toggle"></span>
    <div class="body">
      <div class="t1">
        ${t.pinned ? '<span style="font-size:12px;">📌</span>' : ''}
        <span class="tag-box" style="background:${cat}">${escapeHTML(tagName)}</span>
        <span class="title">${escapeHTML(t.title)}</span>
        ${timeStr}${subInfo}
      </div>
      <div class="how">${escapeHTML(t.how||'无具体步骤')}</div>
    </div>
    <button class="more" data-act="more">⋯</button>
  </div>`;
}

function bindTaskEvents(root) {
  root.querySelectorAll('.task').forEach(el => {
    const id = el.getAttribute('data-id'); const t = state.tasks.find(x => x.id === id); if (!t) return;
    
    el.querySelector('[data-act="toggle"]').onclick = () => { toggleCheck(t); renderAll(); };
    el.querySelector('[data-act="more"]').onclick = e => { e.stopPropagation(); openTaskMenu(t); };
    
    // 长按事件实现
    let pressTimer = null;
    const startPress = (e) => {
      if (e.target.closest('[data-act="toggle"]') || e.target.closest('[data-act="more"]')) return;
      pressTimer = setTimeout(() => {
        if (navigator.vibrate) navigator.vibrate(50);
        openTaskMenu(t);
        pressTimer = null;
      }, 500);
    };
    const cancelPress = () => { if(pressTimer) clearTimeout(pressTimer); };
    const doClick = (e) => {
      cancelPress();
      if (pressTimer === null) return; // 如果长按已触发，不触发点击
      if (e.target.closest('[data-act="toggle"]') || e.target.closest('[data-act="more"]')) return;
      openTaskDetail(t);
    };

    el.addEventListener('touchstart', startPress, {passive: true});
    el.addEventListener('touchend', doClick);
    el.addEventListener('touchcancel', cancelPress);
    el.addEventListener('touchmove', cancelPress);
    
    el.addEventListener('mousedown', startPress);
    el.addEventListener('mouseup', doClick);
    el.addEventListener('mouseleave', cancelPress);
  });
}

/* ========== 弹窗与逻辑 ========== */
const modalRoot = document.getElementById('modal-root'), modalBody = document.getElementById('modal-body');
function openModal(html) { modalBody.innerHTML = html; modalRoot.classList.add('on'); }
function closeModal() { modalRoot.classList.remove('on'); modalBody.innerHTML = ''; }
modalRoot.addEventListener('click', e => { if (e.target.getAttribute && e.target.getAttribute('data-close')) closeModal(); });

function openTaskDetail(t) {
  let seriesInfo = '';
  if (t.groupId) {
    const siblings = state.tasks.filter(x => x.groupId === t.groupId).sort((a,b) => cmpDate(a.date, b.date));
    if (siblings.length > 1) {
      seriesInfo = `<div class="detail-row"><div class="detail-label">系列跨度</div><div class="detail-val">从 ${siblings[0].date} 到 ${siblings[siblings.length-1].date}（共 ${siblings.length} 天）</div></div>`;
    }
  }
  let timeInfo = t.startTime && t.endTime ? `<div class="detail-row"><div class="detail-label">具体时间</div><div class="detail-val" style="color:var(--brand);font-weight:bold;">${t.startTime} - ${t.endTime} (${t.minutes}分钟)</div></div>` : `<div class="detail-row"><div class="detail-label">预计时长</div><div class="detail-val">${t.minutes} 分钟</div></div>`;
  
  let subHtml = '';
  if (t.subtasks && t.subtasks.length > 0) {
    subHtml = `<div class="detail-row"><div class="detail-label">子任务</div><ul class="subtask-list">` +
      t.subtasks.map((st, i) => `<li><input type="checkbox" data-subidx="${i}" ${st.done?'checked':''}> <span style="${st.done?'text-decoration:line-through;color:#9aa5b5':''}">${escapeHTML(st.text)}</span></li>`).join('') +
      `</ul></div>`;
  }

  openModal(`<h3>任务详情</h3>
    <div class="detail-row"><div class="detail-label">标题</div><div class="detail-val" style="font-size:16px;">${escapeHTML(t.title)}</div></div>
    <div class="detail-row"><div class="detail-label">标签</div><div class="detail-val"><span class="tag-box" style="background:${t.tagColor||'#6b7280'}">${escapeHTML(t.tag||'自定义')}</span></div></div>
    <div class="detail-row"><div class="detail-label">日期</div><div class="detail-val">${t.date} (${wdCN(t.date)})</div></div>
    ${seriesInfo}
    ${timeInfo}
    <div class="detail-row"><div class="detail-label">详细步骤</div><div class="detail-box">${escapeHTML(t.how || '未填写')}</div></div>
    <div class="detail-row"><div class="detail-label">完成标准</div><div class="detail-box" style="background:rgba(15,157,118,.07);color:#0b6b51;">${escapeHTML(t.std || '未填写')}</div></div>
    ${subHtml}
    <button class="btn-timer" id="btn-start-focus">▶ 开始专注 (${t.minutes} 分钟)</button>
    <div class="actions"><button class="btn" data-close="1">关闭</button></div>
  `);
  
  if (t.subtasks && t.subtasks.length > 0) {
    modalBody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.onchange = (e) => {
        const idx = parseInt(e.target.getAttribute('data-subidx'), 10);
        t.subtasks[idx].done = e.target.checked;
        saveState();
        // 重新渲染详情页更新划线
        openTaskDetail(t);
        // 如果全部子任务完成，或者取消完成，自动同步主任务状态
        const allDone = t.subtasks.every(x => x.done);
        if (allDone && !isChecked(t)) toggleCheck(t);
        if (!allDone && isChecked(t)) toggleCheck(t);
        renderAll();
      };
    });
  }

  modalBody.querySelector('#btn-start-focus').onclick = () => openPomodoro(t);
}

function openPomodoro(t) {
  let sec = t.minutes * 60;
  let timer = null;
  const format = (s) => `${pad2(Math.floor(s/60))}:${pad2(s%60)}`;
  
  openModal(`<div style="text-align:center;padding:20px 0;">
    <h2 style="font-size:18px;color:var(--sub);margin-bottom:10px;">${escapeHTML(t.title)}</h2>
    <div id="pomo-time" style="font-size:64px;font-weight:bold;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1;margin:20px 0;">${format(sec)}</div>
    <div class="row" style="justify-content:center;margin-top:20px;">
      <button class="btn danger" id="pomo-cancel">放弃</button>
      <button class="btn primary" id="pomo-toggle">暂停</button>
    </div>
  </div>`);
  
  const timeEl = document.getElementById('pomo-time');
  const btnToggle = document.getElementById('pomo-toggle');
  
  const tick = () => {
    sec--;
    if (sec <= 0) {
      clearInterval(timer); timer = null;
      timeEl.textContent = "00:00";
      if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
      if (!isChecked(t)) toggleCheck(t);
      renderAll();
      toast("⏰ 专注时间到！已自动打勾");
      setTimeout(closeModal, 1500);
    } else {
      timeEl.textContent = format(sec);
    }
  };

  timer = setInterval(tick, 1000);
  
  btnToggle.onclick = () => {
    if (timer) {
      clearInterval(timer); timer = null; btnToggle.textContent = '继续';
    } else {
      timer = setInterval(tick, 1000);
      btnToggle.textContent = '暂停';
    }
  };
  
  document.getElementById('pomo-cancel').onclick = () => { if(timer) clearInterval(timer); closeModal(); };
}

function openTaskMenu(t) {
  const ts = tasksOn(t.date);
  const idx = ts.findIndex(x => x.id === t.id);
  
  let html = '<h3>' + escapeHTML(t.title) + '</h3><div class="row">';
  html += '<button class="btn primary" data-a="edit">编辑</button>';
  html += '<button class="btn" data-a="pin">' + (t.pinned ? '取消置顶' : '置顶') + '</button>';
  html += '<button class="btn" data-a="date">改日期</button>';
  html += '<button class="btn danger" data-a="del">删除</button>';
  
  // 排序按钮
  html += '<div style="width:100%;height:1px;background:var(--line);margin:4px 0;"></div>';
  html += '<button class="btn' + (idx <= 0 ? ' disabled' : '') + '" data-a="up" ' + (idx <= 0 ? 'disabled' : '') + '>上移 ⬆</button>';
  html += '<button class="btn' + (idx >= ts.length-1 ? ' disabled' : '') + '" data-a="down" ' + (idx >= ts.length-1 ? 'disabled' : '') + '>下移 ⬇</button>';

  if (t.groupId) { const n = state.tasks.filter(x => x.groupId === t.groupId).length; if (n > 1) html += '<button class="btn danger" data-a="delgroup">删整组(' + n + '条)</button>'; }
  html += '</div>'; openModal(html);
  modalBody.querySelectorAll('[data-a]').forEach(b => {
    b.onclick = () => {
      const a = b.getAttribute('data-a');
      if (a === 'edit') { closeModal(); openTaskEditor(t.id, null); }
      else if (a === 'pin') { t.pinned = !t.pinned; saveState(); closeModal(); renderAll(); toast(t.pinned?'已置顶':'已取消置顶'); }
      else if (a === 'date') { closeModal(); openChangeDateDialog(t); }
      else if (a === 'del') { state.tasks = state.tasks.filter(x => x.id !== t.id); saveState(); closeModal(); renderAll(); toast('已删除'); }
      else if (a === 'delgroup') { const gid = t.groupId; state.tasks = state.tasks.filter(x => x.groupId !== gid); saveState(); closeModal(); renderAll(); toast('已删除整组'); }
      else if (a === 'up') {
        const prev = ts[idx - 1];
        if (prev) {
          const temp = prev.sortOrder;
          prev.sortOrder = t.sortOrder;
          t.sortOrder = temp;
          saveState(); closeModal(); renderAll();
        }
      }
      else if (a === 'down') {
        const next = ts[idx + 1];
        if (next) {
          const temp = next.sortOrder;
          next.sortOrder = t.sortOrder;
          t.sortOrder = temp;
          saveState(); closeModal(); renderAll();
        }
      }
    };
  });
}

function openChangeDateDialog(t) {
  openModal('<h3>改日期</h3><div class="field"><label>新日期</label><input type="date" id="f-date" value="' + t.date + '"></div><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-ok">保存</button></div>');
  modalBody.querySelector('#f-ok').onclick = () => { const v = modalBody.querySelector('#f-date').value; if (v) { t.date = v; saveState(); closeModal(); renderAll(); toast('日期已改'); } };
}

function openTaskEditor(id, defaults) {
  const t = id ? state.tasks.find(x => x.id === id) : null;
  const d = t || defaults || {};
  
  let subText = '';
  if (t && t.subtasks && t.subtasks.length > 0) {
    subText = t.subtasks.map(st => st.text).join('\n');
  }

  openModal(`<h3>${t ? '编辑任务' : '新建任务'}</h3>
    <div class="field"><label>标题</label><input id="f-title" value="${escapeAttr(t ? t.title : '新任务')}"></div>
    <div class="field"><label>标签与颜色</label><div style="display:flex;gap:8px;"><input id="f-tag" style="flex:1;" value="${escapeAttr(t ? (t.tag||'') : '')}" placeholder="如：学习"><input id="f-tagcolor" type="color" value="${t ? (t.tagColor||'#6b7280') : '#6b7280'}" style="width:50px;height:38px;padding:0;border:1px solid var(--line);border-radius:6px;"></div></div>
    <div class="field"><label>具体时间段 (可选)</label><div class="row"><input type="time" id="f-starttime" value="${t ? (t.startTime||'') : ''}"><span>至</span><input type="time" id="f-endtime" value="${t ? (t.endTime||'') : ''}"></div></div>
    <div class="field"><label>时长(分)</label><input id="f-min" type="number" min="1" value="${t ? t.minutes : 20}"></div>
    <div class="field"><label>日期</label><input id="f-date" type="date" value="${t ? t.date : (d.date || todayStr())}"></div>
    <div class="field"><label>怎么做</label><textarea id="f-how">${escapeHTML(t ? (t.how||'') : '')}</textarea></div>
    <div class="field"><label>完成标准</label><textarea id="f-std">${escapeHTML(t ? (t.std||'') : '')}</textarea></div>
    <div class="field"><label>子任务 (可选，每行一个)</label><textarea id="f-sub" style="min-height:48px;" placeholder="第一步...\n第二步...">${escapeHTML(subText)}</textarea></div>
    <div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-save">保存</button></div>`);
  
  modalBody.querySelector('#f-save').onclick = () => {
    const subRaw = modalBody.querySelector('#f-sub').value.trim();
    let newSubtasks = [];
    if (subRaw) {
      const lines = subRaw.split('\n').map(s => s.trim()).filter(Boolean);
      newSubtasks = lines.map((text, i) => {
        // 尽量保留原有的勾选状态
        if (t && t.subtasks && t.subtasks[i] && t.subtasks[i].text === text) return t.subtasks[i];
        return { text, done: false };
      });
    }

    const data = {
      title: modalBody.querySelector('#f-title').value.trim() || '未命名',
      tag: modalBody.querySelector('#f-tag').value.trim() || '自定义',
      tagColor: modalBody.querySelector('#f-tagcolor').value,
      startTime: modalBody.querySelector('#f-starttime').value,
      endTime: modalBody.querySelector('#f-endtime').value,
      minutes: Math.max(1, parseInt(modalBody.querySelector('#f-min').value, 10) || 1),
      date: modalBody.querySelector('#f-date').value || todayStr(),
      how: modalBody.querySelector('#f-how').value.trim(),
      std: modalBody.querySelector('#f-std').value.trim(),
      subtasks: newSubtasks
    };
    if (t) Object.assign(t, data); else {
      const maxOrder = Math.max(...state.tasks.map(x => x.sortOrder || 0), 0);
      state.tasks.push(Object.assign({ id: uid('t'), groupId: uid('g'), category:'custom', pinned: false, sortOrder: maxOrder + 1 }, data));
    }
    saveState(); closeModal(); renderAll(); toast('已保存');
  };
}

function openAddRangeDialog() {
  const start = state.meta.startDate > todayStr() ? state.meta.startDate : todayStr();
  openModal(`<h3>添加持续任务</h3>
    <div class="field"><label>标题</label><input id="f-title" placeholder="例如：练车"></div>
    <div class="field"><label>标签与颜色</label><div style="display:flex;gap:8px;"><input id="f-tag" style="flex:1;" value="自定义"><input id="f-tagcolor" type="color" value="#6b7280" style="width:50px;height:38px;padding:0;border:1px solid var(--line);border-radius:6px;"></div></div>
    <div class="field"><label>时长(分)</label><input id="f-min" type="number" min="1" value="15"></div>
    <div class="field"><label>从</label><input id="f-from" type="date" value="${start}"></div>
    <div class="field"><label>到</label><input id="f-to" type="date" value="${state.meta.endDate}"></div>
    <div class="field"><label>星期（不选＝每天）</label><div class="weekd" id="f-wd">${[1,2,3,4,5,6,0].map(w => `<button type="button" data-w="${w}">${WD_CN[w]}</button>`).join('')}</div></div>
    <div class="field"><label>怎么做</label><textarea id="f-how"></textarea></div>
    <div class="field"><label>完成标准</label><textarea id="f-std"></textarea></div>
    <div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-add">生成任务</button></div>`);
  const wdSet = new Set();
  modalBody.querySelectorAll('#f-wd button').forEach(b => { b.onclick = () => { const w = parseInt(b.getAttribute('data-w'), 10); if (wdSet.has(w)) { wdSet.delete(w); b.classList.remove('on'); } else { wdSet.add(w); b.classList.add('on'); } }; });
  modalBody.querySelector('#f-add').onclick = () => {
    const title = modalBody.querySelector('#f-title').value.trim(); if (!title) return toast('请填标题');
    const tag = modalBody.querySelector('#f-tag').value.trim() || '自定义';
    const tagColor = modalBody.querySelector('#f-tagcolor').value;
    const minutes = Math.max(1, parseInt(modalBody.querySelector('#f-min').value, 10) || 1);
    const from = modalBody.querySelector('#f-from').value, to = modalBody.querySelector('#f-to').value;
    if (!from || !to || from > to) return toast('日期不合法');
    const gid = uid('g'); let cur = from, n = 0;
    let baseOrder = Math.max(...state.tasks.map(x => x.sortOrder || 0), 0);
    while (cur <= to) {
      if (!wdSet.size || wdSet.has(wdOf(cur))) {
        baseOrder++;
        state.tasks.push({ id: uid('t'), groupId: gid, date: cur, category: 'custom', tag, tagColor, title, minutes, how: modalBody.querySelector('#f-how').value.trim(), std: modalBody.querySelector('#f-std').value.trim(), pinned: false, sortOrder: baseOrder, subtasks: [] });
        n++;
      }
      cur = addDays(cur, 1);
    }
    saveState(); closeModal(); renderAll(); toast('已生成 ' + n + ' 条');
  };
}

function openEditCycleDialog() {
  openModal('<h3>修改周期起止</h3><div class="field"><label>开始日期</label><input id="f-start" type="date" value="' + state.meta.startDate + '"></div><div class="field"><label>结束日期</label><input id="f-end" type="date" value="' + state.meta.endDate + '"></div><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-ok">保存</button></div>');
  modalBody.querySelector('#f-ok').onclick = () => { const s = modalBody.querySelector('#f-start').value, e = modalBody.querySelector('#f-end').value; if (!s || !e || s > e) return toast('日期不合法'); state.meta.startDate = s; state.meta.endDate = e; saveState(); closeModal(); renderAll(); toast('已更新'); };
}

function openRestartDialog() {
  openModal('<h3>开始新一轮</h3><div class="field"><label>开始日期</label><input id="f-start" type="date" value="' + todayStr() + '"></div><div class="field"><label>结束日期</label><input id="f-end" type="date" value="' + addDays(todayStr(), 30) + '"></div><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-ok">开始</button></div>');
  modalBody.querySelector('#f-ok').onclick = () => {
    const s = modalBody.querySelector('#f-start').value, e = modalBody.querySelector('#f-end').value; if (!s || !e || s > e) return toast('日期不合法');
    state.meta.startDate = s; state.meta.endDate = e; state.checks = {};
    const delta = daysBetween(state.meta.phaseStart, s);
    state.tasks.forEach(t => t.date = addDays(t.date, delta)); state.meta.phaseStart = s;
    saveState(); closeModal(); renderAll(); toast('新一轮已开始');
  };
}

function openResetDialog() {
  openModal('<h3>重置计划</h3><p class="muted">会删除所有编辑和勾选，恢复成最初的计划。建议先导出备份。</p><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn danger" id="f-ok">确认重置</button></div>');
  modalBody.querySelector('#f-ok').onclick = () => { state = buildSeedState(); saveState(); closeModal(); renderAll(); toast('已重置'); };
}

function openBulkImportDialog() {
  openModal('<h3>批量导入</h3><p class="muted" style="font-size:12.5px;margin:0 0 10px">格式：日期 | 标签 | 标题 | 时长 | 怎么做 | 完成标准</p><div class="field"><textarea id="f-bulk" style="height:150px;" placeholder="粘贴 AI 输出..."></textarea></div><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-do-import">解析</button></div>');
  modalBody.querySelector('#f-do-import').onclick = () => {
    const text = modalBody.querySelector('#f-bulk').value.trim(); if (!text) return;
    const lines = text.split('\n'); let count = 0; const gid = uid('g');
    let baseOrder = Math.max(...state.tasks.map(x => x.sortOrder || 0), 0);
    lines.forEach(line => {
      const parts = line.split('|').map(s => s.trim());
      if (parts.length >= 3) {
        baseOrder++;
        state.tasks.push({ id: uid('t'), groupId: gid, date: parts[0] || todayStr(), tag: parts[1] || '自定义', tagColor: CAT_COLOR.custom, title: parts[2] || '未命名', minutes: parseInt(parts[3], 10) || 20, how: parts[4] || '', std: parts[5] || '', pinned: false, sortOrder: baseOrder, subtasks: [] }); count++;
      }
    });
    saveState(); closeModal(); renderAll(); toast('成功导入 ' + count + ' 条');
  };
}

function exportJSON() {
  const data = { app: 'growth-plan', version: 11, exportedAt: new Date().toISOString(), meta: state.meta, tasks: state.tasks, checks: state.checks };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = 'growth-plan-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); toast('已导出');
}
function openImportDialog() {
  openModal('<h3>导入 JSON</h3><p class="muted">会覆盖当前数据。</p><div class="field"><input type="file" id="f-file" accept="application/json,.json"></div><div class="actions"><button class="btn" data-close="1">取消</button></div>');
  modalBody.querySelector('#f-file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!obj || !Array.isArray(obj.tasks)) throw new Error('bad');
        state = { version: 11, meta: obj.meta || Object.assign({}, DEFAULT_META), tasks: obj.tasks, checks: obj.checks || {} };
        saveState(); closeModal(); renderAll(); toast('已导入');
      } catch(err) { toast('格式错误'); }
    };
    reader.readAsText(f);
  };
}

function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.remove('active'));
  const v = document.getElementById('view-' + name), b = document.querySelector('#tabbar button[data-view="' + name + '"]');
  if (v) v.classList.add('active'); if (b) b.classList.add('active');
  if (name === 'today') renderToday(); if (name === 'cycle') renderCycle(); if (name === 'me') renderMe();
  document.querySelector('.view.active').scrollTo(0,0);
}
document.querySelectorAll('#tabbar button').forEach(b => b.onclick = () => switchView(b.getAttribute('data-view')));

function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHTML(s).replace(/"/g, '&quot;'); }
let toastTimer = null;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1600); }
function renderAll() { renderToday(); renderCycle(); renderMe(); }

const topBtn = document.getElementById('back-to-top');
document.querySelectorAll('.view').forEach(v => v.addEventListener('scroll', () => topBtn.classList.toggle('show', v.scrollTop > 300)));
topBtn.onclick = () => document.querySelector('.view.active').scrollTo({ top: 0, behavior: 'smooth' });

function applyBackground() {
  const savedBg = localStorage.getItem('custom-bg-img');
  if (savedBg) {
    document.body.style.backgroundImage = `url(${savedBg})`;
    document.body.classList.add('has-bg');
  } else {
    document.body.style.backgroundImage = '';
    document.body.classList.remove('has-bg');
  }
}

loadState();
applyBackground();
renderAll();
</script>
</body>
</html>
