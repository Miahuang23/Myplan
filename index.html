<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4b5cf0">
<title>成长计划</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="成长计划">
<style>
:root{
  --bg:#f5f7fb;--ink:#141a24;--sub:#5d6878;--line:#e4e8f0;--card:#fff;
  --brand:#4b5cf0;--brand2:#8b5cf6;--ok:#0f9d76;--warn:#c2410c;
  --radius:14px;--shadow:0 1px 2px rgba(20,26,36,.05),0 10px 24px -14px rgba(20,26,36,.22);
  --sb: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.6;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
}
#app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:60px}
.view{padding:16px 14px calc(16px + var(--sb));display:none}
.view.active{display:block}

/* 底部 Tab */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + var(--sb));backdrop-filter:blur(12px);
}
#tabbar button{
  flex:1;border:0;background:none;padding:6px 0 2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--sub);font-size:11px;font-family:inherit;
}
#tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabbar button.active{color:var(--brand)}

/* 通用 */
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:17px;margin:22px 0 10px;letter-spacing:-.01em}
h3{font-size:14.5px;margin:0 0 8px}
.muted{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:14px}
.bar{height:8px;border-radius:999px;background:#e9edf6;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:999px;transition:width .35s}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:13.5px;font-family:inherit;cursor:pointer;
}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.danger{background:#fff;color:var(--warn);border-color:rgba(194,65,12,.35)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* 今日 */
.today-head{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.today-date{font-size:26px;font-weight:700;letter-spacing:-.02em}
.today-week{color:var(--sub);font-size:13px}
.today-stat{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--sub)}
.pill b{color:var(--ink)}

/* 任务卡 */
.task{
  display:flex;gap:10px;align-items:flex-start;
  padding:12px 12px;margin-top:8px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
}
.task.done{opacity:.62}
.task .cb{
  flex:none;width:22px;height:22px;border:1.6px solid #c3cddd;border-radius:7px;background:#fff;
  margin-top:1px;position:relative;cursor:pointer;
}
.task.done .cb{background:var(--ok);border-color:var(--ok)}
.task.done .cb::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:12px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.task .body{min-width:0;flex:1}
.task .t1{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.task .title{font-weight:600;font-size:14.5px}
.task.done .title{text-decoration:line-through;color:#9aa5b5}
.task .min{font-size:11.5px;color:#7c8797;background:#f2f5fa;border-radius:6px;padding:1px 6px}
.task .how{font-size:12.8px;color:var(--sub);margin-top:2px}
.task .std{font-size:12.2px;color:#0b6b51;background:rgba(15,157,118,.07);border-radius:8px;padding:3px 8px;margin-top:6px;display:inline-block}
.task.done .how,.task.done .std{color:#9aa5b5;text-decoration:line-through}
.task .cat{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.task .more{border:0;background:none;color:#93a0b4;font-size:20px;padding:0 4px;cursor:pointer;line-height:1}
.empty{padding:24px;text-align:center;color:var(--sub);font-size:13px}

/* 周期 */
.daygrp{margin-top:14px}
.dayhead{
  position:sticky;top:0;z-index:5;background:var(--bg);
  display:flex;align-items:baseline;gap:8px;padding:8px 2px 6px;font-weight:650;
}
.dayhead .dt{font-size:14.5px}
.dayhead .wd{font-size:12px;color:var(--sub);font-weight:400}
.dayhead .cnt{margin-left:auto;font-size:12px;color:var(--sub);font-weight:400}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:2px -2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--line);background:#fff;color:var(--sub);
  border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;
}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seqbox{margin-top:16px}
.seqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:8px}
.sq{padding:6px 4px;text-align:center;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:11px;line-height:1.3}
.sq b{display:block;font-size:11.5px}
.sq i{font-style:normal;color:#a5b0c0;font-size:10px;letter-spacing:.06em}
.sq.on{background:rgba(15,157,118,.1);border-color:rgba(15,157,118,.4);color:#0b6b51}
.sq.on i{color:#0b6b51}

/* 我的 */
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--sub)}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.list{list-style:none;padding:0;margin:8px 0 0}
.list li{padding:10px 0;border-bottom:1px solid #f1f4f9;display:flex;align-items:center;gap:8px;font-size:13.5px}
.list li:last-child{border-bottom:0}
.ph{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f4f9;font-size:13.5px}
.ph:last-child{border-bottom:0}
.ph .nm{flex:1}
.ph .pg{width:100px;height:6px;border-radius:999px;background:#e9edf6;overflow:hidden}
.ph .pg i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.ph .v{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.searchbox{display:flex;gap:8px;margin-top:8px}
.searchbox input{
  flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  font-size:14px;font-family:inherit;background:#fff;color:var(--ink);
}
.results li{cursor:pointer}
.results li:hover{background:#fafbfe}

/* Modal */
#modal-root{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center}
#modal-root.on{display:flex}
.mask{position:absolute;inset:0;background:rgba(15,20,30,.45)}
.modal{
  position:relative;width:100%;max-width:520px;background:#fff;border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + var(--sb));max-height:88dvh;overflow-y:auto;
  box-shadow:0 -10px 30px -8px rgba(0,0,0,.2);
  animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.modal h3{margin:0 0 10px;font-size:16px}
.field{margin:10px 0}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
  font-size:14px;font-family:inherit;color:var(--ink);background:#fff;
}
.field textarea{min-height:64px;resize:vertical}
.field .row{gap:8px}
.field .row>*{flex:1}
.weekd{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.weekd button{
  width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;
  color:var(--sub);font-family:inherit;font-size:12.5px;cursor:pointer;
}
.weekd button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* 一键回顶 & Toast */
#back-to-top {
  position: fixed; right: 16px; bottom: 80px; width: 44px; height: 44px;
  border-radius: 50%; background: var(--brand); color: #fff; font-size: 20px;
  border: none; box-shadow: 0 4px 12px rgba(75,92,240,.3);
  display: none; align-items: center; justify-content: center; z-index: 90;
}
#back-to-top.show { display: flex; }
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:rgba(20,26,36,.92);color:#fff;padding:8px 14px;border-radius:999px;
  font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;
}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ========== 状态 ========== */
let state = null;
function uid(p){ return (p||'t')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }

function buildSeedState() {
  const tasks = SEED_ROWS.map(function(row, i) {
    return { id:'seed-'+i, date:row[0], category:row[1], title:row[2], minutes:row[3], how:row[4], std:row[5], tag:CAT_LABEL[row[1]], tagColor:CAT_COLOR[row[1]], groupId:null };
  });
  const map = {};
  tasks.forEach(function(t) {
    const k = t.category + '||' + t.title;
    if (!map[k]) map[k] = 'g-' + Math.random().toString(36).slice(2, 9);
    t.groupId = map[k];
  });
  return { version: 4, meta: Object.assign({}, DEFAULT_META), tasks: tasks, checks: {} };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) { state = buildSeedState(); saveState(); return; }
    const s = JSON.parse(raw);
    if (!s || !s.tasks) throw new Error('bad');
    if (!s.meta) s.meta = Object.assign({}, DEFAULT_META);
    if (!s.checks) s.checks = {};
    s.version = 4;
    state = s;
  } catch(e) { state = buildSeedState(); saveState(); }
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {} }

/* ========== 日期工具 ========== */
function pad2(n){ return n<10?'0'+n:''+n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseD(s){ const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function fmtCN(s){ const d=parseD(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function wdOf(s){ return parseD(s).getDay(); }
function wdCN(s){ return '周'+WD_CN[wdOf(s)]; }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function cmpDate(a,b){ return a<b?-1:a>b?1:0; }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }

/* ========== 计算 ========== */
function tasksOn(date) {
  return state.tasks.filter(t => t.date === date).sort((a,b) => (a.category==='sk'?1:0)-(b.category==='sk'?1:0) || a.title.localeCompare(b.title,'zh'));
}
function allDates() { const set = {}; state.tasks.forEach(t => set[t.date] = 1); return Object.keys(set).sort(); }
function isChecked(t) { return !!state.checks[t.id]; }
function toggleCheck(t) { if (state.checks[t.id]) delete state.checks[t.id]; else state.checks[t.id] = 1; saveState(); }
function progressOn(date) { const ts = tasksOn(date); const done = ts.filter(isChecked).length; return { total: ts.length, done: done, pct: ts.length ? Math.round(done/ts.length*100) : 0 }; }
function overallProgress() { const total = state.tasks.length; const done = state.tasks.filter(isChecked).length; return { total: total, done: done, pct: total ? Math.round(done/total*100) : 0 }; }
function phaseProgress(p) { const ts = state.tasks.filter(t => t.date >= p.start && t.date <= p.end); const done = ts.filter(isChecked).length; return { total: ts.length, done: done, pct: ts.length ? Math.round(done/ts.length*100) : 0 }; }
function streakDays() {
  let cur = todayStr();
  const todayP = progressOn(cur);
  if (todayP.total > 0 && todayP.done < todayP.total) cur = addDays(cur, -1);
  let n = 0;
  for (let i = 0; i < 400; i++) {
    const p = progressOn(cur);
    if (p.total === 0) { cur = addDays(cur, -1); continue; }
    if (p.done === p.total) { n++; cur = addDays(cur, -1); } else break;
  }
  return n;
}
function weekRangeFor(dateStr) {
  const d = parseD(dateStr);
  const wd = d.getDay();
  const start = addDays(dateStr, -(wd === 0 ? 6 : wd - 1));
  return [start, addDays(start, 6)];
}
function weekProgress(dateStr) {
  const r = weekRangeFor(dateStr);
  const ts = state.tasks.filter(t => t.date >= r[0] && t.date <= r[1]);
  const done = ts.filter(isChecked).length;
  return { from: r[0], to: r[1], total: ts.length, done: done, pct: ts.length ? Math.round(done/ts.length*100) : 0 };
}

    el.querySelector('#btn-shift').onclick = () => { state.meta.startDate = today; saveState(); renderAll(); toast('开始日期已更新'); };
    return;
  }
  const ts = tasksOn(today);
  const p = progressOn(today);
  let html = '<div class="today-head"><span class="today-date">' + fmtCN(today) + '</span><span class="today-week">' + wdCN(today) + '</span></div><div class="today-stat"><span class="pill">今日 <b>' + p.done + '/' + p.total + '</b></span><span class="pill">完成率 <b>' + p.pct + '%</b></span><span class="pill">连续打卡 <b>' + streakDays() + '</b> 天</span></div><div class="bar"><i style="width:' + p.pct + '%"></i></div>';
  if (!ts.length) {
    html += '<div class="empty card" style="margin-top:14px">今天还没有任务。<br><br><button class="btn primary" id="btn-add-today">+ 添加今日任务</button></div>';
  } else {
    html += '<div id="today-tasks">';
    ts.forEach(t => html += renderTaskHTML(t, 'today'));
    html += '</div><div style="margin-top:14px;text-align:center"><button class="btn" id="btn-add-today">+ 添加今日任务</button></div>';
  }
  el.innerHTML = html;
  el.querySelector('#btn-add-today').onclick = () => openTaskEditor(null, { date: today });
  bindTaskEvents(el, 'today');
}

/* ========== 视图：周期 ========== */
let cycleFilter = 'all', cycleSearch = '';
function renderCycle() {
  const el = document.getElementById('view-cycle');
  const m = state.meta;
  let html = '<h1>周期</h1><p class="muted">' + m.startDate + ' – ' + m.endDate + ' · 共 ' + state.tasks.length + ' 项</p><div class="row" style="margin-top:8px"><button class="btn sm" id="btn-edit-cycle">修改周期起止</button><button class="btn sm primary" id="btn-add-range">+ 添加任务</button></div><div class="searchbox"><input id="cycle-search" type="search" placeholder="搜索任务标题…" value="' + escapeAttr(cycleSearch) + '"></div><div class="chips" style="margin-top:10px"><button class="chip' + (cycleFilter==='all'?' on':'') + '" data-f="all">全部</button>';
  PHASES.forEach((p, i) => html += '<button class="chip' + (cycleFilter===String(i)?' on':'') + '" data-f="' + i + '">' + p.name + '</button>');
  html += '</div><div class="seqbox card pad"><h3>阿达帕林核对（只读）</h3><p class="muted" style="margin:0;font-size:12.5px">跟着任务勾选自动更新，共 ' + countAdaparin() + ' 次。</p><div class="seqgrid">' + renderSeqGrid() + '</div></div>';
  const dates = filteredDates();
  if (!dates.length) html += '<div class="empty">没有匹配的任务</div>';
  else {
    dates.forEach(d => {
      const ts = tasksOn(d).filter(taskMatchesFilter);
      if (!ts.length) return;
      const p = progressOn(d);
      html += '<div class="daygrp"><div class="dayhead"><span class="dt">' + fmtCN(d) + '</span><span class="wd">' + wdCN(d) + '</span><span class="cnt">' + p.done + '/' + p.total + '</span></div>';
      ts.forEach(t => html += renderTaskHTML(t, 'cycle'));
      html += '</div>';
    });
  }
  el.innerHTML = html;
  el.querySelector('#btn-edit-cycle').onclick = openEditCycleDialog;
  el.querySelector('#btn-add-range').onclick = openAddRangeDialog;
  el.querySelector('#cycle-search').addEventListener('input', e => { cycleSearch = e.target.value.trim(); renderCycle(); });
  el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { cycleFilter = b.getAttribute('data-f'); renderCycle(); });
  bindTaskEvents(el, 'cycle');
}
function taskMatchesFilter(t) {
  if (cycleFilter !== 'all') { const p = PHASES[Number(cycleFilter)]; if (p && (t.date < p.start || t.date > p.end)) return false; }
  if (cycleSearch) { const q = cycleSearch.toLowerCase(); if (t.title.toLowerCase().indexOf(q) < 0 && (t.how||'').toLowerCase().indexOf(q) < 0) return false; }
  return true;
}
function filteredDates() {
  let ds = allDates();
  if (cycleFilter !== 'all') { const p = PHASES[Number(cycleFilter)]; if (p) ds = ds.filter(d => d >= p.start && d <= p.end); }
  if (cycleSearch) ds = ds.filter(d => tasksOn(d).some(taskMatchesFilter));
  return ds;
}
function countAdaparin() { return state.tasks.filter(t => t.category === 'sk' && /阿达帕林/.test(t.title)).length; }
function renderSeqGrid() {
  const adap = state.tasks.filter(t => t.category === 'sk' && /阿达帕林/.test(t.title)).sort((a,b) => cmpDate(a.date, b.date));
  if (!adap.length) return '<div class="muted" style="grid-column:1/-1;font-size:12.5px">还没有阿达帕林任务</div>';
  return adap.map(t => '<div class="sq' + (isChecked(t)?' on':'') + '" title="' + escapeAttr(t.title) + '"><b>' + fmtCN(t.date) + '</b><i>第' + (adap.indexOf(t)+1) + '次</i></div>').join('');
}

  const el = document.getElementById('view-me');
  const o = overallProgress(), streak = streakDays(), wk = weekProgress(todayStr()), today = todayStr();
  let html = '<h1>我的</h1><div class="statgrid"><div class="stat"><div class="k">总进度</div><div class="v">' + o.pct + '%</div><div class="muted" style="font-size:12px">' + o.done + ' / ' + o.total + '</div></div><div class="stat"><div class="k">连续打卡</div><div class="v">' + streak + '<span style="font-size:13px;font-weight:400;color:var(--sub)"> 天</span></div><div class="muted" style="font-size:12px">今天往前数</div></div><div class="stat"><div class="k">今日完成</div><div class="v">' + progressOn(today).done + '<span style="font-size:13px;font-weight:400;color:var(--sub)">/' + progressOn(today).total + '</span></div><div class="muted" style="font-size:12px">' + fmtCN(today) + ' ' + wdCN(today) + '</div></div><div class="stat"><div class="k">本周完成率</div><div class="v">' + wk.pct + '%</div><div class="muted" style="font-size:12px">' + fmtCN(wk.from) + ' – ' + fmtCN(wk.to) + '</div></div></div>';
  html += '<div class="card pad" style="margin-top:12px"><h3>五个阶段</h3>' + renderPhaseListHTML() + '</div><div class="card pad" style="margin-top:12px"><h3>快捷操作</h3><div class="row"><button class="btn" id="btn-check-today">勾选今日全部</button><button class="btn" id="btn-uncheck-today">取消今日全部</button></div></div>';
  html += '<div class="card pad" style="margin-top:12px"><h3>搜索</h3><div class="searchbox"><input id="me-search" type="search" placeholder="输入标题关键词，回车搜索"></div><ul class="list results" id="me-results"></ul></div>';
  // 换色
  html += '<div class="card pad" style="margin-top:12px"><h3>页面背景颜色</h3><div class="row"><input type="color" id="bg-color-picker" style="width:50px;height:36px;padding:0;border:1px solid var(--line);border-radius:6px;cursor:pointer;" value="' + (localStorage.getItem('custom-bg') || '#f5f7fb') + '"><span class="muted" style="font-size:12px">点击色块选择颜色，立即生效</span></div></div>';
  // 批量导入
  html += '<div class="card pad" style="margin-top:12px"><h3>批量导入计划</h3><p class="muted" style="font-size:12.5px;margin:0 0 10px">让 AI 按“日期 | 标签 | 标题 | 时长 | 怎么做 | 完成标准”的格式输出，直接粘贴进来。</p><button class="btn primary" id="btn-bulk-import">粘贴文本生成任务</button></div>';
  // 数据管理
  html += '<div class="card pad" style="margin-top:12px"><h3>数据管理</h3><div class="row"><button class="btn primary" id="btn-export">导出 JSON</button><button class="btn" id="btn-import">导入 JSON</button><button class="btn danger" id="btn-reset">重置为初始计划</button></div><p class="muted" style="margin:10px 0 0;font-size:12px">导出文件建议存到网盘或发给自己；导入会覆盖当前数据。</p></div>';
  html += '<div class="card pad" style="margin-top:12px"><h3>关于</h3><p class="muted" style="margin:0;font-size:12.5px">版本 v4 · 数据存于本机浏览器 localStorage，换设备不同步。清理浏览器数据会丢失勾选，请定期导出。</p></div>';
  el.innerHTML = html;
  el.querySelector('#btn-check-today').onclick = () => { tasksOn(today).forEach(t => { if (!isChecked(t)) toggleCheck(t); }); renderAll(); toast('已勾选今日全部'); };
  el.querySelector('#btn-uncheck-today').onclick = () => { tasksOn(today).forEach(t => { if (isChecked(t)) toggleCheck(t); }); renderAll(); toast('已取消今日全部'); };
  el.querySelector('#btn-export').onclick = exportJSON;
  el.querySelector('#btn-import').onclick = openImportDialog;
  el.querySelector('#btn-reset').onclick = openResetDialog;
  el.querySelector('#btn-bulk-import').onclick = openBulkImportDialog;
  el.querySelector('#bg-color-picker').addEventListener('input', e => { const c = e.target.value; document.documentElement.style.setProperty('--bg', c); localStorage.setItem('custom-bg', c); });
  el.querySelector('#me-search').addEventListener('input', e => {
    const q = e.target.value.trim(); const list = document.getElementById('me-results');
    if (!q) { list.innerHTML = ''; return; }
    const hits = state.tasks.filter(t => t.title.toLowerCase().indexOf(q.toLowerCase()) >= 0).slice(0, 30);
    list.innerHTML = hits.map(t => '<li data-id="' + t.id + '"><span class="cat" style="background:' + (t.tagColor||CAT_COLOR[t.category]||CAT_COLOR.custom) + '"></span>' + escapeHTML(t.title) + '<span class="spacer"></span><span class="muted" style="font-size:12px">' + fmtCN(t.date) + '</span></li>').join('') || '<li class="muted" style="border:0">没有匹配</li>';
    list.querySelectorAll('li[data-id]').forEach(li => { li.onclick = () => { const t = state.tasks.find(x => x.id === li.getAttribute('data-id')); if(t){ switchView('cycle'); cycleFilter = 'all'; cycleSearch = t.title; renderCycle(); setTimeout(() => { const grps = document.querySelectorAll('#view-cycle .dayhead .dt'); for (const g of grps) { if (g.textContent === fmtCN(t.date)) { g.parentElement.scrollIntoView({behavior:'smooth', block:'start'}); break; } } }, 80); } }; });
  });
}
function renderPhaseListHTML() {
  return PHASES.map(p => { const pr = phaseProgress(p); return '<div class="ph"><span class="nm">' + p.name + '<br><span class="muted" style="font-size:11.5px">' + fmtCN(p.start) + ' – ' + fmtCN(p.end) + '</span></span><span class="pg"><i style="width:' + pr.pct + '%"></i></span><span class="v">' + pr.done + '/' + pr.total + '</span></div>'; }).join('');
}

/* ========== 任务渲染 ========== */
function renderTaskHTML(t, ctx) {
  const done = isChecked(t);
  const cat = t.tagColor || CAT_COLOR[t.category] || CAT_COLOR.custom;
  return '<div class="task' + (done ? ' done' : '') + '" data-id="' + t.id + '"><span class="cb" data-act="toggle"></span><div class="body"><div class="t1"><span class="title"><span class="cat" style="background:' + cat + '"></span>' + escapeHTML(t.title) + '</span><span class="min">' + t.minutes + 'min</span></div>' + (t.how ? '<div class="how">' + escapeHTML(t.how) + '</div>' : '') + (t.std ? '<div class="std">' + escapeHTML(t.std) + '</div>' : '') + '</div><button class="more" data-act="more" aria-label="更多">⋯</button></div>';
}
function bindTaskEvents(root, ctx) {
  root.querySelectorAll('.task').forEach(el => {
    const id = el.getAttribute('data-id'); const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    el.querySelector('[data-act="toggle"]').onclick = () => { toggleCheck(t); renderAll(); };
    el.querySelector('[data-act="more"]').onclick = e => { e.stopPropagation(); openTaskMenu(t, ctx); };
  });
}

/* ========== 弹窗 ========== */
const modalRoot = document.getElementById('modal-root'), modalBody = document.getElementById('modal-body');
function openModal(html) { modalBody.innerHTML = html; modalRoot.classList.add('on'); }
function closeModal() { modalRoot.classList.remove('on'); modalBody.innerHTML = ''; }
modalRoot.addEventListener('click', e => { if (e.target.getAttribute && e.target.getAttribute('data-close')) closeModal(); });

function openTaskMenu(t, ctx) {
  let html = '<h3>' + escapeHTML(t.title) + '</h3><p class="muted" style="margin:0 0 10px;font-size:12.5px">' + fmtCN(t.date) + ' ' + wdCN(t.date) + ' · ' + t.minutes + 'min</p><div class="row"><button class="btn primary" data-a="edit">编辑</button><button class="btn" data-a="date">改日期</button><button class="btn danger" data-a="del">删除这一条</button>';
  if (t.groupId) { const n = state.tasks.filter(x => x.groupId === t.groupId).length; if (n > 1) html += '<button class="btn danger" data-a="delgroup">删除这一系列（' + n + ' 条）</button>'; }
  html += '</div>'; openModal(html);
  modalBody.querySelectorAll('[data-a]').forEach(b => {
    b.onclick = () => {
      const a = b.getAttribute('data-a');
      if (a === 'edit') { closeModal(); openTaskEditor(t.id, null); }
      else if (a === 'date') { closeModal(); openChangeDateDialog(t); }
      else if (a === 'del') { state.tasks = state.tasks.filter(x => x.id !== t.id); saveState(); closeModal(); renderAll(); toast('已删除'); }
      else if (a === 'delgroup') { const gid = t.groupId; state.tasks = state.tasks.filter(x => x.groupId !== gid); saveState(); closeModal(); renderAll(); toast('已删除整组'); }
    };
  });
}
function openChangeDateDialog(t) {
  openModal('<h3>改日期</h3><div class="field"><label>新日期</label><input type="date" id="f-date" value="' + t.date + '"></div><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-ok">保存</button></div>');
  modalBody.querySelector('#f-ok').onclick = () => { const v = modalBody.querySelector('#f-date').value; if (v) { t.date = v; saveState(); closeModal(); renderAll(); toast('日期已改'); } };
}
function openTaskEditor(id, defaults) {
  const t = id ? state.tasks.find(x => x.id === id) : null;
  const d = t || defaults || {};
  openModal('<h3>' + (t ? '编辑任务' : '新建任务') + '</h3><div class="field"><label>标题</label><input id="f-title" value="' + escapeAttr(t ? t.title : '新任务') + '"></div><div class="field"><label>标签与颜色</label><div style="display:flex;gap:8px;"><input id="f-tag" style="flex:1;" value="' + escapeAttr(t ? (t.tag||'') : '') + '" placeholder="如：学习、运动"><input id="f-tagcolor" type="color" value="' + (t ? (t.tagColor||'#6b7280') : '#6b7280') + '" style="width:50px;height:38px;padding:0;border:1px solid var(--line);border-radius:6px;cursor:pointer;"></div></div><div class="field"><label>时长（分钟）</label><input id="f-min" type="number" min="1" value="' + (t ? t.minutes : 20) + '"></div><div class="field"><label>日期</label><input id="f-date" type="date" value="' + (t ? t.date : (d.date || todayStr())) + '"></div><div class="field"><label>怎么做</label><textarea id="f-how">' + escapeHTML(t ? (t.how||'') : '') + '</textarea></div><div class="field"><label>完成标准</label><textarea id="f-std">' + escapeHTML(t ? (t.std||'') : '') + '</textarea></div><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-save">保存</button></div>');
  modalBody.querySelector('#f-save').onclick = () => {
    const data = { title: modalBody.querySelector('#f-title').value.trim() || '未命名', tag: modalBody.querySelector('#f-tag').value.trim() || '自定义', tagColor: modalBody.querySelector('#f-tagcolor').value, minutes: Math.max(1, parseInt(modalBody.querySelector('#f-min').value, 10) || 1), date: modalBody.querySelector('#f-date').value || todayStr(), how: modalBody.querySelector('#f-how').value.trim(), std: modalBody.querySelector('#f-std').value.trim() };
    if (t) Object.assign(t, data); else state.tasks.push(Object.assign({ id: uid('t'), groupId: uid('g'), category:'custom' }, data));
    saveState(); closeModal(); renderAll(); toast('已保存');
  };
}
function openAddRangeDialog() {
  const start = state.meta.startDate > todayStr() ? state.meta.startDate : todayStr();
  openModal('<h3>添加持续任务</h3><div class="field"><label>标题</label><input id="f-title" placeholder="例如：晨间拉伸"></div><div class="field"><label>标签与颜色</label><div style="display:flex;gap:8px;"><input id="f-tag" style="flex:1;" value="自定义"><input id="f-tagcolor" type="color" value="#6b7280" style="width:50px;height:38px;padding:0;border:1px solid var(--line);border-radius:6px;cursor:pointer;"></div></div><div class="field"><label>时长（分钟）</label><input id="f-min" type="number" min="1" value="15"></div><div class="field"><label>从</label><input id="f-from" type="date" value="' + start + '"></div><div class="field"><label>到</label><input id="f-to" type="date" value="' + state.meta.endDate + '"></div><div class="field"><label>星期（不选＝每天）</label><div class="weekd" id="f-wd">' + [1,2,3,4,5,6,0].map(w => '<button type="button" data-w="' + w + '">' + WD_CN[w] + '</button>').join('') + '</div></div><div class="field"><label>怎么做</label><textarea id="f-how"></textarea></div><div class="field"><label>完成标准</label><textarea id="f-std"></textarea></div><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-add">生成任务</button></div>');
  const wdSet = new Set();
  modalBody.querySelectorAll('#f-wd button').forEach(b => { b.onclick = () => { const w = parseInt(b.getAttribute('data-w'), 10); if (wdSet.has(w)) { wdSet.delete(w); b.classList.remove('on'); } else { wdSet.add(w); b.classList.add('on'); } }; });
  modalBody.querySelector('#f-add').onclick = () => {
    const title = modalBody.querySelector('#f-title').value.trim(); if (!title) return toast('请填标题');
    const tag = modalBody.querySelector('#f-tag').value.trim() || '自定义';
    const tagColor = modalBody.querySelector('#f-tagcolor').value;
    const minutes = Math.max(1, parseInt(modalBody.querySelector('#f-min').value, 10) || 1);
    const from = modalBody.querySelector('#f-from').value, to = modalBody.querySelector('#f-to').value;
    if (!from || !to || from > to) return toast('日期不合法');
    const gid = uid('g'); let cur = from, n = 0;
    while (cur <= to) {
      if (!wdSet.size || wdSet.has(wdOf(cur))) { state.tasks.push({ id: uid('t'), groupId: gid, date: cur, category: 'custom', tag, tagColor, title, minutes, how: modalBody.querySelector('#f-how').value.trim(), std: modalBody.querySelector('#f-std').value.trim() }); n++; }
      cur = addDays(cur, 1);
    }
    saveState(); closeModal(); renderAll(); toast('已生成 ' + n + ' 条任务');
  };
}
function openEditCycleDialog() {
  openModal('<h3>修改周期起止</h3><p class="muted" style="font-size:12.5px;margin:0 0 10px">只影响日期范围和统计显示，不会删除任务。</p><div class="field"><label>开始日期</label><input id="f-start" type="date" value="' + state.meta.startDate + '"></div><div class="field"><label>结束日期</label><input id="f-end" type="date" value="' + state.meta.endDate + '"></div><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-ok">保存</button></div>');
  modalBody.querySelector('#f-ok').onclick = () => { const s = modalBody.querySelector('#f-start').value, e = modalBody.querySelector('#f-end').value; if (!s || !e || s > e) return toast('日期不合法'); state.meta.startDate = s; state.meta.endDate = e; saveState(); closeModal(); renderAll(); toast('周期已更新'); };
}
function openRestartDialog() {
  openModal('<h3>开始新一轮</h3><p class="muted" style="font-size:12.5px;margin:0 0 10px">会重置周期起止日期，并清空所有勾选状态；任务内容保留。</p><div class="field"><label>新一轮开始日期</label><input id="f-start" type="date" value="' + todayStr() + '"></div><div class="field"><label>新一轮结束日期</label><input id="f-end" type="date" value="' + addDays(todayStr(), 30) + '"></div><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-ok">开始</button></div>');
  modalBody.querySelector('#f-ok').onclick = () => {
    const s = modalBody.querySelector('#f-start').value, e = modalBody.querySelector('#f-end').value; if (!s || !e || s > e) return toast('日期不合法');
    state.meta.startDate = s; state.meta.endDate = e; state.checks = {};
    const delta = daysBetween(state.meta.phaseStart, s);
    state.tasks.forEach(t => t.date = addDays(t.date, delta)); state.meta.phaseStart = s;
    saveState(); closeModal(); renderAll(); toast('新一轮已开始');
  };
}
function openResetDialog() {
  openModal('<h3>重置为初始计划</h3><p class="muted" style="font-size:12.5px;margin:0 0 10px">会删除所有编辑和勾选，恢复成最初的 31 天计划。建议先导出备份。</p><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn danger" id="f-ok">确认重置</button></div>');
  modalBody.querySelector('#f-ok').onclick = () => { state = buildSeedState(); saveState(); closeModal(); renderAll(); toast('已重置'); };
}
function openBulkImportDialog() {
  openModal('<h3>批量导入</h3><p class="muted" style="font-size:12.5px;margin:0 0 10px">格式：2026-10-19 | 学习 | 背单词 | 30 | 不背单词 | 完成打卡<br>（缺少的项可以留空，用竖线隔开即可）</p><div class="field"><textarea id="f-bulk" style="height:150px;" placeholder="在这里粘贴 AI 输出的内容..."></textarea></div><div class="actions"><button class="btn" data-close="1">取消</button><button class="btn primary" id="f-do-import">解析并添加</button></div>');
  modalBody.querySelector('#f-do-import').onclick = () => {
    const text = modalBody.querySelector('#f-bulk').value.trim(); if (!text) return;
    const lines = text.split('\n'); let count = 0; const gid = uid('g');
    lines.forEach(line => {
      const parts = line.split('|').map(s => s.trim());
      if (parts.length >= 3) { state.tasks.push({ id: uid('t'), groupId: gid, date: parts[0] || todayStr(), tag: parts[1] || '自定义', tagColor: CAT_COLOR.custom, title: parts[2] || '未命名', minutes: parseInt(parts[3], 10) || 20, how: parts[4] || '', std: parts[5] || '' }); count++; }
    });
    saveState(); closeModal(); renderAll(); toast('成功导入 ' + count + ' 条任务');
  };
}

/* ========== 导入 / 导出 ========== */
function exportJSON() {
  const data = { app: 'growth-plan', version: 4, exportedAt: new Date().toISOString(), meta: state.meta, tasks: state.tasks, checks: state.checks };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = 'growth-plan-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); toast('已导出');
}
function openImportDialog() {
  openModal('<h3>导入 JSON</h3><p class="muted" style="font-size:12.5px;margin:0 0 10px">会覆盖当前任务和勾选。请选择之前导出的 .json 文件。</p><div class="field"><input type="file" id="f-file" accept="application/json,.json"></div><div class="actions"><button class="btn" data-close="1">取消</button></div>');
  modalBody.querySelector('#f-file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!obj || !Array.isArray(obj.tasks)) throw new Error('bad');
        state = { version: 4, meta: obj.meta || Object.assign({}, DEFAULT_META), tasks: obj.tasks, checks: obj.checks || {} };
        saveState(); closeModal(); renderAll(); toast('已导入');
      } catch(err) { toast('文件格式不正确'); }
    };
    reader.readAsText(f);
  };
}

/* ========== 视图切换 & 工具 ========== */
function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.remove('active'));
  const v = document.getElementById('view-' + name), b = document.querySelector('#tabbar button[data-view="' + name + '"]');
  if (v) v.classList.add('active'); if (b) b.classList.add('active');
  if (name === 'today') renderToday(); if (name === 'cycle') renderCycle(); if (name === 'me') renderMe();
  document.querySelector('.view.active').scrollTo(0,0);
}
document.querySelectorAll('#tabbar button').forEach(b => b.onclick = () => switchView(b.getAttribute('data-view')));

function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHTML(s).replace(/"/g, '&quot;'); }
let toastTimer = null;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1600); }
function renderAll() { renderToday(); renderCycle(); renderMe(); }

// 一键回顶
const topBtn = document.getElementById('back-to-top');
document.querySelectorAll('.view').forEach(v => v.addEventListener('scroll', () => topBtn.classList.toggle('show', v.scrollTop > 300)));
topBtn.onclick = () => document.querySelector('.view.active').scrollTo({ top: 0, behavior: 'smooth' });

/* ========== 启动 ========== */
loadState();
const savedBg = localStorage.getItem('custom-bg');
if (savedBg) document.documentElement.style.setProperty('--bg', savedBg);
renderAll();
</script>
</body>
</html>
